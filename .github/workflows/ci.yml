name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./db/test.db
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --silent

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push test database schema
        run: npx prisma db push --skip-generate

      - name: TypeScript check
        id: tsc
        continue-on-error: true
        run: npx tsc --noEmit --pretty false > tsc.log 2>&1

      - name: Upload TypeScript log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-log
          path: tsc.log
          if-no-files-found: ignore

      - name: Fail if TypeScript failed
        if: steps.tsc.outcome == 'failure'
        run: cat tsc.log && exit 1

      - name: Run tests
        run: npm test

      - name: Build Next.js app
        run: npm run build
