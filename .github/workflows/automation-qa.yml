name: Automation QA

on:
  push:
    branches:
      - 'automation/mediquote-production-*'

jobs:
  isolated-qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mediquote_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mediquote_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mediquote_e2e
      MEDIQUOTE_E2E: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout automation branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate ephemeral QA credentials
        shell: bash
        run: |
          echo "SESSION_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "E2E_MAESTRO_PASSWORD=$(openssl rand -base64 36 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "E2E_COMMERCIAL_PASSWORD=$(openssl rand -base64 36 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Install application dependencies
        run: npm install --silent

      - name: Install browser test runner in ephemeral workspace
        run: npm install --no-save --silent @playwright/test@1.55.0

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create isolated database schema
        run: npx prisma db push --skip-generate

      - name: Seed only synthetic E2E records
        run: npx tsx scripts/seed-e2e.ts

      - name: TypeScript check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee typecheck.log

      - name: Unit and regression tests
        id: unit_tests
        continue-on-error: true
        run: npm test

      - name: Build production application for browser QA
        id: production_build
        continue-on-error: true
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start isolated production-mode MediQuote server
        if: steps.production_build.outcome == 'success'
        run: |
          npm start > /tmp/mediquote-e2e.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mediquote-e2e.log
          exit 1

      - name: Browser E2E
        id: browser_e2e
        if: steps.production_build.outcome == 'success'
        continue-on-error: true
        run: npx playwright test

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mediquote-isolated-qa-evidence
          path: |
            typecheck.log
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Enforce TypeScript gate
        if: always()
        run: test '${{ steps.typecheck.outcome }}' = 'success'

      - name: Enforce unit/regression gate
        if: always()
        run: test '${{ steps.unit_tests.outcome }}' = 'success'

      - name: Enforce production build gate
        if: always()
        run: test '${{ steps.production_build.outcome }}' = 'success'

      - name: Enforce browser gate
        if: always()
        run: test '${{ steps.browser_e2e.outcome }}' = 'success'
