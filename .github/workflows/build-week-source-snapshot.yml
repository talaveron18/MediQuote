name: Build Week isolated source snapshot

on:
  push:
    branches:
      - feature/build-week-ai-review-loop
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Upload isolated source
        uses: actions/upload-artifact@v4
        with:
          name: mediquote-build-week-source
          path: |
            .
            !node_modules
            !.git
          include-hidden-files: true
          retention-days: 1
      - name: Report snapshot run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 31,
              body: `BUILD_WEEK_SNAPSHOT_RUN_ID=${context.runId}`
            })
